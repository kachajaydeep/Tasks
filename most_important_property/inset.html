<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inset</title>
    
    <style>
        div {
            position: relative;
            background-color: yellow;
            width: 500px;
            height: 500px;
        }

        div>.inset {
            background-color: blue;
            position: absolute;
            inset: 20px 10px 30px 60px;
        }
    </style>
</head>

<body>
    <h1><mark>Note:</mark>This inset properties, including inset, have no effect on non-positioned elements.</h1>
    <div>
        <span class="inset">Inset box</span>

    </div>
    <i class="fa-solid fa-sparkles" style="color: #FFD43B;"></i>

</body>

</html>
