<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card_Task</title>
    <link rel="stylesheet" href="../Card_task/card_task.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="checkbox">
        <i class="fa-solid fa-moon" style="color: #FFD43B;"></i>
        <input type="checkbox" name="" id="check">
        <label for="check" class="button"></label>
    </div>

    <div class="container">
        <img src="https://images.unsplash.com/photo-1462536943532-57a629f6cc60?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3" alt="images">
        <h1 class="text">New brand name</h1>
        <h2 class="text">Size</h2>
        <div class="items">
            <div class="boxes">31</div>
            <div class="boxes">32</div>
            <div class="boxes">33</div>
            <div class="boxes">34</div>
            <div class="boxes">35</div>
            <div class="boxes">36</div>
        </div>

        <div class="bottom">
            <h1 class="text">$299</h1>
            <div class="background">
                <button>
                    <p class="text"><i class="fa-solid fa-cart-shopping"></i>Add to cart</p>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
