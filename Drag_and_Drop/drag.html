<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Input Drag and Drop</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./drag.css" />
    <script src="./drag.js" defer></script>
    <!--We also Put "defer" here we also consider that the DOM is loaded and that we can work with elements in DOM before JS load-->
  </head>
  <body>
    <main>
      <section class="droparea">
        <i class="fa-regular fa-images" id="jp"></i>
        <p id="text1">Drop Your .png or .jpg files here!</p>
        <p id="text2"><small>Up to 20 images, No Max file size</small></p>
      </section>
    </main>

  </body>
</html>
