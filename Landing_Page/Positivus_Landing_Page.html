<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus Landing_Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Positivus_Landing_Page.css">
</head>

<body>
    <div class="header">
        <div class="navbar">
            <div class="logo">
                <img src="./Pngs/Vector.png" alt="Vector">
                <img src="./Pngs/Positivus.png" alt="Positivus">
            </div>
            <label>
                <input type="checkbox">
                <div class="toggle">
                    <span class="top_line common"></span>
                    <span class="middle_line common"></span>
                    <span class="bottom_line common"></span>
                </div>
                <ul class="slide">
                    <li><a href="#" class="grotesk">About us</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Use Cases</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">Blog</a></li>
                    <button class="btn1 btn">Request a quote</button>
                </ul>
            </label>
        </div>
    </div>

    <div class="super-container">
        <div class="container">
            <div class="left-side">

                <h1 class="text-heading">Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO, PPC, social media marketing, and content creation.</p>
                <button class="btn btn1">Book a consultation</button>
            </div>
            <div class="right-side">
                <img class="Illustration" src="./Pngs/Illustration.png" alt="Illustration">
            </div>
        </div>
    </div>

</body>

</html>
