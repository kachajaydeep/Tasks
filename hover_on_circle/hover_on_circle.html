<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover_On_Circle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./hover_on_circle.css">
</head>

<body>
    <div class="card">
        <div class="heading">Join The Open-Source<span>Galaxy</span></div>
        <div class="content">
            <div class="item item--create">
                <img src="./code_sy.svg" alt="code_sy">
                <span>Create</span>
            </div>
            <div class="item item--inspire">
                <img src="./rocket.svg" alt="Rocket">
                <span>Inspire</span>
            </div>
            <div class="item item--post">
                <img src="./star.svg" alt="Star">
                <span>Post</span>
            </div>
        </div>
        <button>Code to Infinity!</button>
    </div>

</body>

</html>
