<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent_Card</title>
    <link rel="stylesheet" href="./transparent_Card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div data-text="Github" style="--r:-15;" class="glass">
            <i class="fa-brands fa-github"></i>
        </div>
        <div data-text="Code" style="--r:5" class="glass">
            <i class="fa-solid fa-code"></i>
        </div>
        <div data-text="Earn" style="--r:25" class="glass">
            <img src="./image.svg" alt="image" style="width: 100px;height: 100px;fill: #fff;">
        </div>
    </div>
</body>
</html>
