<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 200px;
            height: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 1s;
            padding: 20px;
            cursor: pointer;
        }

        .card:hover {
            transform: rotateY(45deg);
        }

        .card-content {
            text-align: center;
            /* transform-style: preserve-3d; */
        }

        .card-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .card-text {
            color: #666;
            margin-bottom: 20px;
        }

        .card-image {
            width: 100px;
            height: 100px;
            background: #e0e0e0;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-content">
            <div class="card-image">🎯</div>
            <h2 class="card-title">Hello!</h2>
            <p class="card-text">Hover over me to see how I rotate without preserve-3d. Notice how all the content appears flat during rotation.</p>
        </div>
    </div>
</body>
</html>
